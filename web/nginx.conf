# Production: serves the SPA and proxies /api/* to the API service in the same
# namespace, so the browser talks to one origin and the session cookie just works.
server {
  listen 8080;
  root /usr/share/nginx/html;

  location = /health {
    access_log off;
    return 200;
  }

  location /api/ {
    proxy_pass http://api:8090/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  location / {
    try_files $uri /index.html;
  }
}
